<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE6EE"/>
      <stop offset="52%" stop-color="#FFB6C6"/>
      <stop offset="100%" stop-color="#FF839D"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AD9C5"/>
      <stop offset="100%" stop-color="#4AB8A1"/>
    </linearGradient>
  </defs>
  <!-- 角丸グラデーション背景 -->
  <rect width="192" height="192" rx="44" fill="url(#bg)"/>
  <!-- 背景のやわらかいクリーム円 -->
  <circle cx="96" cy="96" r="74" fill="#FFFDF9" opacity="0.32"/>

  <!-- 後ろの棚の飾りキラ星 -->
  <path d="M40 44 L43 51 L50 54 L43 57 L40 64 L37 57 L30 54 L37 51 Z" fill="#FFFDF9" opacity="0.92"/>
  <path d="M152 38 L154 43 L159 45 L154 47 L152 52 L150 47 L145 45 L150 43 Z" fill="#FFFDF9" opacity="0.9"/>
  <circle cx="154" cy="68" r="4" fill="#F6C453"/>

  <!-- もふもふ猫の耳＆頭（漫画の上からひょっこり） -->
  <path d="M56 78 L66 42 L89 62 Z" fill="#FFFDF9" stroke="#4A3F35" stroke-width="4" stroke-linejoin="round"/>
  <path d="M136 78 L126 42 L103 62 Z" fill="#FFFDF9" stroke="#4A3F35" stroke-width="4" stroke-linejoin="round"/>
  <path d="M62 72 L68 51 L83 64 Z" fill="#FFB0C2"/>
  <path d="M130 72 L124 51 L109 64 Z" fill="#FFB0C2"/>

  <ellipse cx="96" cy="84" rx="42" ry="34" fill="#FFFDF9" stroke="#4A3F35" stroke-width="4"/>
  <!-- 顔 -->
  <circle cx="79" cy="80" r="4" fill="#4A3F35"/>
  <circle cx="113" cy="80" r="4" fill="#4A3F35"/>
  <circle cx="77.8" cy="78.8" r="1.4" fill="#FFFDF9"/>
  <circle cx="111.8" cy="78.8" r="1.4" fill="#FFFDF9"/>
  <ellipse cx="70" cy="88" rx="5.5" ry="3.5" fill="#FF9AB0" opacity="0.65"/>
  <ellipse cx="122" cy="88" rx="5.5" ry="3.5" fill="#FF9AB0" opacity="0.65"/>
  <path d="M90 88 Q93 92 96 88 Q99 92 102 88" fill="none" stroke="#4A3F35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 開いた漫画ブックカバー（ミント色） -->
  <rect x="33" y="99" width="126" height="58" rx="14" fill="url(#bookCover)" stroke="#4A3F35" stroke-width="4"/>

  <!-- 漫画ページ（左＆右） -->
  <path d="M44 98 Q70 93 96 101 L96 146 Q70 140 44 146 Z" fill="#FFFDF9" stroke="#4A3F35" stroke-width="3.8" stroke-linejoin="round"/>
  <path d="M148 98 Q122 93 96 101 L96 146 Q122 140 148 146 Z" fill="#FFFDF9" stroke="#4A3F35" stroke-width="3.8" stroke-linejoin="round"/>

  <!-- ページ内のコマ割り風の優しい線 -->
  <rect x="52" y="108" width="34" height="14" rx="3" fill="#FFE5EC"/>
  <rect x="52" y="126" width="18" height="11" rx="2.5" fill="#FDF6EC"/>
  <rect x="73" y="126" width="13" height="11" rx="2.5" fill="#DDF5EF"/>
  <rect x="106" y="108" width="34" height="12" rx="3" fill="#FFF3C4"/>
  <rect x="106" y="124" width="34" height="13" rx="3" fill="#FFE5EC"/>

  <!-- ページの上に乗るもふもふ前足 -->
  <ellipse cx="64" cy="100" rx="9" ry="6.5" fill="#FFFDF9" stroke="#4A3F35" stroke-width="3.5"/>
  <ellipse cx="128" cy="100" rx="9" ry="6.5" fill="#FFFDF9" stroke="#4A3F35" stroke-width="3.5"/>

  <!-- 中央から垂れるピンクのリボンしおり -->
  <path d="M90 101 H102 V166 L96 159 L90 166 Z" fill="#FF7C98" stroke="#4A3F35" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
